set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g set-titles on
set -g set-titles-string "#S"
set -g status-left ""
set -g status-right "#S"
# prefix+e: open the pane's git root (or cwd) in $TMUX_KIT_EDITOR (default: VS Code)
bind e run-shell -b 'cd "#{pane_current_path}" && ${TMUX_KIT_EDITOR:-code} "$(git rev-parse --show-toplevel 2>/dev/null || pwd)"'
# prefix+W: fzf branch picker -> worktree + session (see bin/wt)
bind W display-popup -E -w 60% -h 50% -d "#{pane_current_path}" "$HOME/.local/bin/wt pick"
# prefix+X: remove the current pane's worktree (confirms; wt rm safety checks apply)
bind X display-popup -E -w 60% -h 50% -d "#{pane_current_path}" "$HOME/.local/bin/wt close"

# prefix+s: session list, most recently used first (O cycles order in the view)
bind s choose-tree -Zs -O activity

# Session persistence: resurrect saves/restores (prefix+C-s / prefix+C-r),
# continuum autosaves every 15 min and restores when the tmux server starts.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# personal overrides/additions (not part of tmux-kit)
source-file -q ~/.tmux.local.conf

run '~/.tmux/plugins/tpm/tpm'  # keep last
